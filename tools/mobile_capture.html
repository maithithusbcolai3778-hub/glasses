<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手机拍照采集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
  }
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  #shutter {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.2);
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
  }
  #shutter.active {
    background: #ff4444;
    transform: translateX(-50%) scale(0.92);
  }
  #progress-ring {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%) rotate(-90deg);
    z-index: 11;
    pointer-events: none;
    width: 110px;
    height: 110px;
  }
  #progress-ring circle {
    fill: none;
    stroke-width: 4;
  }
  #progress-ring .bg {
    stroke: rgba(255,255,255,0.3);
  }
  #progress-ring .fg {
    stroke: #00ff88;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
    transition: stroke-dashoffset 0.1s linear;
  }
  #top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 16px;
    background: rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #top-bar select, #top-bar input {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    outline: none;
  }
  #top-bar input {
    flex: 1;
    min-width: 80px;
  }
  #counter {
    font-size: 14px;
    min-width: 55px;
    text-align: right;
  }
  #hint {
    position: fixed;
    bottom: 170px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    text-align: center;
    background: rgba(0,0,0,0.4);
    padding: 6px 14px;
    border-radius: 20px;
    pointer-events: none;
  }
  #flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.1s;
  }
  #canvas {
    display: none;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div id="overlay"></div>

<div id="top-bar">
  <select id="camera-select">
    <option value="environment">后置摄像头</option>
    <option value="user">前置摄像头</option>
  </select>
  <input id="prefix" type="text" placeholder="文件名前缀" value="traffic_red">
  <div id="counter">0 张</div>
</div>

<div id="hint">长按快门拍照，连续按可连拍</div>

<svg id="progress-ring" viewBox="0 0 110 110">
  <circle class="bg" cx="55" cy="55" r="50"></circle>
  <circle class="fg" cx="55" cy="55" r="50"></circle>
</svg>

<div id="shutter"></div>
<div id="flash"></div>
<canvas id="canvas"></canvas>

<script>
  const video = document.getElementById('video');
  const shutter = document.getElementById('shutter');
  const progressFg = document.querySelector('#progress-ring .fg');
  const flash = document.getElementById('flash');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const counter = document.getElementById('counter');
  const prefixInput = document.getElementById('prefix');
  const cameraSelect = document.getElementById('camera-select');

  let currentStream = null;
  let longPressTimer = null;
  let isLongPress = false;
  let photoCount = 0;
  let progressInterval = null;
  const LONG_PRESS_MS = 600; // 长按触发时间

  // 请求摄像头
  async function startCamera(facingMode = 'environment') {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    try {
      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
    } catch (err) {
      alert('无法打开摄像头：' + err.message);
    }
  }

  // 拍照并保存
  function takePhoto() {
    if (!video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // 前置摄像头需要镜像翻转
    if (cameraSelect.value === 'user') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0); // 重置

    const filename = `${prefixInput.value}_${String(Date.now()).slice(-8)}.jpg`;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);

      photoCount++;
      counter.textContent = photoCount + ' 张';

      // 闪光反馈
      flash.style.opacity = '0.8';
      setTimeout(() => flash.style.opacity = '0', 100);
    }, 'image/jpeg', 0.92);
  }

  function startLongPress() {
    isLongPress = false;
    shutter.classList.add('active');
    let elapsed = 0;
    progressInterval = setInterval(() => {
      elapsed += 50;
      const pct = Math.min(elapsed / LONG_PRESS_MS, 1);
      progressFg.style.strokeDashoffset = 314 * (1 - pct);
      if (elapsed >= LONG_PRESS_MS && !isLongPress) {
        isLongPress = true;
        takePhoto();
      }
    }, 50);
  }

  function endLongPress() {
    shutter.classList.remove('active');
    clearInterval(progressInterval);
    progressFg.style.strokeDashoffset = 314;
  }

  // 触摸事件
  shutter.addEventListener('touchstart', e => {
    e.preventDefault();
    startLongPress();
  }, { passive: false });

  shutter.addEventListener('touchend', e => {
    e.preventDefault();
    endLongPress();
  });

  shutter.addEventListener('mousedown', e => {
    startLongPress();
  });

  shutter.addEventListener('mouseup', e => {
    endLongPress();
  });

  shutter.addEventListener('mouseleave', e => {
    endLongPress();
  });

  // 切换摄像头
  cameraSelect.addEventListener('change', () => {
    startCamera(cameraSelect.value);
  });

  // 初始启动
  startCamera('environment');
</script>

</body>
</html>
